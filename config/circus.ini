[watcher:daphne]
cmd = daphne --application-close-timeout 60 --fd $(circus.sockets.daphne) config.asgi:application
use_sockets = True
numprocesses = $(circus.env.daphne_worker_num)
copy_env = true
virtualenv = $(circus.env.virtual_env)
priority = 1
# Daphne seems to be sometimes running out of database connections. This is probably
# related to long running requests. `--application-close-timeout=60` somewhat above
# tries to mitigate this. To ensure any leaked connections don't end up Daphne not being
# able to get new connections, restart the Daphne processes after around one day.
max_age = 86400
max_age_variance = 180

[socket:daphne]
host = 127.0.0.1
port = 23564

[watcher:dramatiq]
cmd = $(circus.env.virtual_env)/bin/python manage.py rundramatiq
copy_env = True
priority = 2

[watcher:apscheduler]
cmd = $(circus.env.virtual_env)/bin/python manage.py runscheduler
copy_env = True
priority = 3
