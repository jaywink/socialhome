[watcher:daphne]
cmd = daphne --fd $(circus.sockets.daphne) config.asgi:application
use_sockets = True
numprocesses = $(circus.env.daphne_worker_num)
copy_env = true
virtualenv = $(circus.env.virtual_env)
priority = 1

[socket:daphne]
host = 127.0.0.1
port = 23564

[watcher:dramatiq]
cmd = $(circus.env.virtual_env)/bin/python manage.py rundramatiq
copy_env = True
priority = 2

[watcher:apscheduler]
cmd = $(circus.env.virtual_env)/bin/python manage.py runscheduler
copy_env = True
priority = 3
