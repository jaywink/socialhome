[watcher:daphne]
cmd = /usr/local/bin/daphne --fd $(circus.sockets.daphne) config.asgi:application -v1 --proxy-headers
use_sockets = True
numprocesses = $(circus.env.daphne_worker_num)
copy_env = true
priority = 1

[socket:daphne]
host = 0.0.0.0
port = 23564

[env:daphne]
PYTHONPATH = $PYTHONPATH:/app

[watcher:dramatiq]
cmd = /usr/local/bin/python manage.py rundramatiq
copy_env = True
priority = 2

[watcher:apscheduler]
cmd = /usr/local/bin/python manage.py runscheduler
copy_env = True
priority = 3
