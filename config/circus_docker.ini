[watcher:daphne]
cmd = /usr/local/bin/daphne --application-close-timeout 60 --fd $(circus.sockets.daphne) config.asgi:application -v1 --proxy-headers
use_sockets = True
numprocesses = $(circus.env.daphne_worker_num)
copy_env = true
priority = 1
# Daphne seems to be sometimes running out of database connections. This is probably
# related to long running requests. `--application-close-timeout=60` somewhat above
# tries to mitigate this. To ensure any leaked connections don't end up Daphne not being
# able to get new connections, restart the Daphne processes after around one day.
max_age = 86400
max_age_variance = 180

[socket:daphne]
host = 0.0.0.0
port = 23564

[env:daphne]
PYTHONPATH = $PYTHONPATH:/app

[watcher:dramatiq]
cmd = /usr/local/bin/python manage.py rundramatiq
copy_env = True
priority = 2

[watcher:apscheduler]
cmd = /usr/local/bin/python manage.py runscheduler
copy_env = True
priority = 3
